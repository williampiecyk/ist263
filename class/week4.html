<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TItle Goes Here</title>
</head>

<body>
    <h1>Tables</h1>
    <table>
        <caption>Our First Table</caption>
        <tr>
            <th>Column One</th>
            <th>Column Two</th>
            <th>Column Three</th>
        </tr>
        <tr>
            <td>Freshmen</td>
            <td>Sophomores</td>
            <td>Juniors</td>
        </tr>
    </table>

    <h1>Forms</h1>
    <form action = ""method="">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname"><br>
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname"><br>

        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments">
        
        </textarea><br><br>

        <p>Pick a number</p>

        <input type="radio" id="num1" name="numbers" value="1">
        <label for="num1">1</label><br>
        <input type="radio" id="num2" name="numbers" value="2">
        <label for="num2">2</label><br>
        <input type="radio" id="num3" name="numbers" value="3">
        <label for="num3">3</label><br><br>

        <input type="checkbox" id="veh1" name="veh1" value="Bike">
        <label for="veh1">I have a bike</label><br>
        <input type="checkbox" id="veh2" name="veh2" value="Car">
        <label for="veh2">I have a car</label><br><br>

        <label for="cars">Select a car:</label>
        <select name="cars" id="cars">
            <option value="BMW">BMW</option>
            <option value="Ford">Ford</option>
        </select><br><br>

        <input type="submit" value="Submit This Form">
    </form>
</body>

</html>
