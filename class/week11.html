<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JavaScript Introduction</title>
    <script>
        function SecondBlock() {
            alert('Second Alert');
        }
        function hovery() {
            alert('I am hovering over this text');
        }
        function clicky () {
            alert('I clicked on a single word.');
        }
    </script>
</head>

<body>
    <script>alert('I am sending an alert!');</script>
    <h1 onclick="SecondBlock()">Header</h1>
    <p onmouseover="hovery()">Content goes here.</p>
    <p>Content goes <span ondblclick="clicky()">here</span>.</p>
</body>

</html>
